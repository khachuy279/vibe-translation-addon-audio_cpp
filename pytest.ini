[pytest]
testpaths = backend/tests
markers =
    slow: test cần nạp model thật (tầng B). Chạy bằng `pytest -m slow`.
    gpu: test cần GPU.
    full: E2E 3 model ASR+Translation+TTS (tầng C). Mặc định BỎ QUA.
addopts = -m "not slow and not full" -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
